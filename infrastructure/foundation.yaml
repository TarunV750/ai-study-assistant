AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS foundation for the Cloud-Based AI Study Assistant, including dedicated
  execution roles, CloudWatch logs, private document storage, and secure PDF
  upload instructions.

Parameters:
  ProjectName:
    Type: String
    Default: ai-study-assistant
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    ConstraintDescription: >-
      Use 3-25 lowercase letters, numbers, or hyphens, beginning with a letter.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      Optional IAM permissions-boundary ARN required by some school or company
      AWS accounts. Leave blank in a personal sandbox account.

  LambdaArtifactBucketName:
    Type: String
    Description: S3 bucket containing the packaged create-upload-url Lambda

  CreateUploadUrlArtifactKey:
    Type: String
    Description: S3 object key for the packaged create-upload-url Lambda

  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact browser origin allowed to submit presigned S3 POST uploads
    MinLength: 1

  MaxUploadSizeBytes:
    Type: Number
    Default: 10485760
    MinValue: 1
    MaxValue: 52428800
    Description: Maximum accepted PDF size; defaults to 10 MiB

  UploadUrlExpirationSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900
    Description: Lifetime of a generated S3 upload form

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - POST
            AllowedOrigins:
              - !Ref FrontendOrigin
            ExposedHeaders:
              - ETag
              - x-amz-request-id
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: private-course-material

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub "${DocumentsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: DenyUploadsWithoutSseS3
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${DocumentsBucket.Arn}/uploads/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: AES256

  CreateUploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-create-upload-url"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ProcessDocumentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-process-document"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AskQuestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-ask-question"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  GenerateQuestionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-generate-questions"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ManageDocumentsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-manage-documents"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CreateUploadUrlRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for creating document upload URLs
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CreateUploadUrlLogGroup.Arn}:*"
        - PolicyName: CreatePdfUploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DocumentsBucket.Arn}/uploads/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CreateUploadUrlFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - CreateUploadUrlLogGroup
      - DocumentsBucketPolicy
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-create-upload-url"
      Description: Validates PDF metadata and returns a constrained S3 presigned POST
      Architectures:
        - arm64
      Code:
        S3Bucket: !Ref LambdaArtifactBucketName
        S3Key: !Ref CreateUploadUrlArtifactKey
      Environment:
        Variables:
          DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
          MAX_UPLOAD_SIZE_BYTES: !Ref MaxUploadSizeBytes
          UPLOAD_URL_EXPIRATION_SECONDS: !Ref UploadUrlExpirationSeconds
      Handler: handler.lambda_handler
      MemorySize: 128
      Role: !GetAtt CreateUploadUrlRole.Arn
      Runtime: python3.12
      Timeout: 10
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ProcessDocumentRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for asynchronous PDF processing
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ProcessDocumentLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AskQuestionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for retrieval-augmented question answering
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${AskQuestionLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  GenerateQuestionsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for grounded practice-question generation
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${GenerateQuestionsLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ManageDocumentsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for listing and deleting documents
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ManageDocumentsLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DocumentsBucketName:
    Description: Private bucket containing uploaded course PDFs
    Value: !Ref DocumentsBucket

  CreateUploadUrlFunctionName:
    Description: Lambda that creates constrained PDF upload forms
    Value: !Ref CreateUploadUrlFunction

  CreateUploadUrlFunctionArn:
    Description: ARN of the PDF upload-form Lambda
    Value: !GetAtt CreateUploadUrlFunction.Arn

  CreateUploadUrlRoleArn:
    Description: Execution role ARN for the upload-URL Lambda
    Value: !GetAtt CreateUploadUrlRole.Arn

  ProcessDocumentRoleArn:
    Description: Execution role ARN for the document-processing Lambda
    Value: !GetAtt ProcessDocumentRole.Arn

  AskQuestionRoleArn:
    Description: Execution role ARN for the question-answering Lambda
    Value: !GetAtt AskQuestionRole.Arn

  GenerateQuestionsRoleArn:
    Description: Execution role ARN for the question-generation Lambda
    Value: !GetAtt GenerateQuestionsRole.Arn

  ManageDocumentsRoleArn:
    Description: Execution role ARN for the document-management Lambda
    Value: !GetAtt ManageDocumentsRole.Arn

  LogGroupNames:
    Description: CloudWatch log groups created for the five future Lambdas
    Value: !Join
      - ","
      - - !Ref CreateUploadUrlLogGroup
        - !Ref ProcessDocumentLogGroup
        - !Ref AskQuestionLogGroup
        - !Ref GenerateQuestionsLogGroup
        - !Ref ManageDocumentsLogGroup
